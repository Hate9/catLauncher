# Tag-triggered release: push a tag like v2.0.0 and this builds, signs and attaches the APK.
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64  the .jks file, base64-encoded:  base64 -w0 release.jks
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        # Tolerate line wraps and stray whitespace from copy-pasting the base64, then prove the
        # file opens with the given password so a bad secret fails here with a clear message.
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d -i > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null \
            || { echo "::error::Keystore did not decode or the password/alias is wrong"; exit 1; }
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      - name: Build signed release
        run: ./gradlew --no-daemon assembleRelease testDebugUnitTest
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "catLauncher-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: catLauncher-*.apk
          generate_release_notes: true
